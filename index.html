<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Street Hierarchy Explorer</title>
    <!-- GoatCounter visitor counting (privacy-friendly, no cookies).
         Ignores localhost, so dev traffic isn't counted. -->
    <script
      data-goatcounter="https://road-hierarchy-visualizer.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="app"><canvas id="deck-canvas"></canvas></div>
    <div id="legend">
      <h1>Street Hierarchy Explorer</h1>
      <form id="zip-form" autocomplete="off">
        <input
          id="zip-input"
          type="text"
          inputmode="numeric"
          pattern="\d{5}"
          maxlength="5"
          placeholder="ZIP code"
          aria-label="ZIP code"
        />
        <button type="submit">Go</button>
      </form>
      <div id="place"></div>
      <ul id="legend-rows"></ul>
      <p class="hint">
        roads stream in automatically as you pan and zoom &middot; drag to pan &middot;
        right-drag to tilt/rotate &middot; scroll to zoom
      </p>
    </div>
    <div id="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
