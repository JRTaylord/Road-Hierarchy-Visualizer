<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Street Hierarchy Explorer</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="legend">
      <h1>Street Hierarchy Explorer</h1>
      <form id="zip-form" autocomplete="off">
        <input
          id="zip-input"
          type="text"
          inputmode="numeric"
          pattern="\d{5}"
          maxlength="5"
          placeholder="ZIP code"
          value="98402"
          aria-label="ZIP code"
        />
        <button type="submit">Go</button>
      </form>
      <div id="place"></div>
      <ul id="legend-rows"></ul>
      <p class="hint">
        hover empty space to preview an area, click to load it &middot; drag to pan &middot;
        right-drag to tilt/rotate &middot; scroll to zoom
      </p>
    </div>
    <div id="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
